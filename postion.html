<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>CSS Positioning</title>
<link rel="stylesheet" href="postion.css">
<style>
.container {
    position: relative;
    width: 1570px;
    height: 900px;

    background-image: url("images/Itachi.jpg");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;

    border: 2px solid #333;
}


    .pos-item {
        position: absolute;
        font-family: sans-serif;
        font-size: 14px;
        font-weight: bold;
    }

    .top-left {
        top: 10px;
        left: 10px;
    }

    .top-right {
        top: 10px;
        right: 10px;
    }

    .center {
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
    }


    .bottom-left {
        bottom: 10px;
        left: 10px;
    }

    .bottom-right {
        bottom: 10px;
        right: 10px;
    }
</style>
</head>
<body>

<div class="container">
    <div class="pos-item top-left">Vedansh</div>
    <div class="pos-item top-right">Vedansh</div>
    <div class="pos-item center">Vedansh</div>
    <div class="pos-item bottom-left">Vedansh</div>
    <div class="pos-item bottom-right">Vedansh</div>
</div>

</body>
</html>
